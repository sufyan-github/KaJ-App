name: Landing page

# Tests and builds the KAAJ landing page on every push or pull request that
# touches it. Only pushes to codex/production-hardening publish to GitHub Pages;
# landing/** branches and pull requests run tests and the build, never a deploy.
# The site is static.
on:
  push:
    branches: [codex/production-hardening, "landing/**"]
    paths:
      - "landing-page/**"
      - ".github/workflows/landing-page.yml"
  pull_request:
    branches: [codex/production-hardening, "landing/**"]
    paths:
      - "landing-page/**"
      - ".github/workflows/landing-page.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or PR; a newer push cancels the older run on the same ref.
concurrency:
  group: landing-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.target.outputs.publish }}
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4

      - id: target
        name: Decide whether this run publishes
        run: echo "publish=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/production-hardening' }}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing-page/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test release selection
        run: pnpm run test:release

      - name: Test Bangla/English copy parity
        run: pnpm run test:content

      - name: Build
        run: pnpm run build

      # Checks the built output, so it must run after the build.
      - name: Test Sites packaging
        run: pnpm run test:sites

      - name: Prepare static site
        if: steps.target.outputs.publish == 'true'
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - if: steps.target.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - if: steps.target.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing-page/dist/client

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
