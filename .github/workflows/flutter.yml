name: Flutter quality gates

on:
  pull_request:
  push:
    branches: [main]

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject server credentials in client files
        run: bash tool/check_client_secrets.sh
      - name: Scan repository and Git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  release-build:
    name: Release build and size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      # A debug build cannot catch an R8 or resource-shrinking regression, and
      # shrinking is exactly what keeps the download small enough to install on
      # a low-storage phone over metered data. Build what ships.
      - name: Build prod release APK (arm64)
        run: |
          flutter build apk --release --flavor prod \
            --target-platform android-arm64 \
            --dart-define=API_BASE_URL=https://api.kaaj.app/api/v1

      - name: Verify package metadata and reject embedded server credentials
        run: |
          bash tool/check_client_secrets.sh
          APK=build/app/outputs/flutter-apk/app-prod-release.apk
          AAPT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" | grep "package: name='app.kaaj.mobile'"

      - name: Enforce the download size budget
        run: |
          APK=build/app/outputs/flutter-apk/app-prod-release.apk
          SIZE_MB=$(( $(stat -c%s "$APK") / 1048576 ))
          echo "arm64 release APK: ${SIZE_MB} MB"
          echo "### Release APK: ${SIZE_MB} MB (budget 35 MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE_MB" -gt 35 ]; then
            echo "::error::APK grew to ${SIZE_MB} MB, over the 35 MB budget."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-prod-release-verification-arm64
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error
